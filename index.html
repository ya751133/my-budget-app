<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧預算與財務分析</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="預算記帳">

  <!-- 引入美化 Excel 套件 -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 16px; background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    
    .card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04); }
    .row { display: flex; justify-content: space-between; align-items: center; }
    
    .progress-bar-bg { width: 100%; height: 10px; background: #e2e8f0; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { height: 100%; width: 0%; border-radius: 6px; transition: width 0.3s ease; }
    
    input { padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); font-size: 15px; width: 100%; outline: none; background: #f8fafc; }
    input:focus { border-color: var(--primary); background: #fff; }
    button.btn-main { background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 13px; font-weight: 600; font-size: 15px; width: 100%; cursor: pointer; }
    button.btn-main:active { opacity: 0.85; }
    
    /* 日期選鈕 */
    .pill-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .pill-btn { flex: 1; padding: 9px 0; border: 1.5px solid var(--border); background: #fff; border-radius: 10px; font-size: 14px; font-weight: 500; text-align: center; color: var(--subtext); cursor: pointer; }
    .pill-btn.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 700; }
    
    /* 分類標籤 */
    .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px 0; }
    .chip-btn { padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 14px; background: #fff; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .chip-btn.active { border-color: var(--primary); background: var(--primary); color: #fff; font-weight: 600; }
    
    /* 圓餅圖與圖例 */
    .chart-container { display: flex; flex-direction: column; align-items: center; margin: 12px 0; }
    .chart-legend { width: 100%; margin-top: 14px; }
    .legend-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 6px; padding: 4px 0; border-bottom: 1px dashed #f1f5f9; }
    .legend-color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }

    /* 明細列表與操作 */
    .expense-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .expense-list-item:last-child { border-bottom: none; }
    .del-btn { background: #fee2e2; color: var(--danger); border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
    .edit-btn { background: #e0f2fe; color: #0284c7; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; margin-right: 4px; }
    
    .amount-positive { color: var(--success); font-weight: 700; }
    .amount-negative { color: var(--danger); font-weight: 700; }

    .export-btn { border: none; border-radius: 10px; padding: 12px 0; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

    /* 報表全螢幕預覽彈窗 (解決 iPhone 無法生成/亂碼問題) */
    #reportModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      z-index: 9999;
      padding: 16px;
      overflow-y: auto;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- 月份與總預算 -->
  <div class="card">
    <div class="row">
      <h3 style="margin:0;">📅 月份</h3>
      <input type="month" id="currentMonth" onchange="switchMonth()" style="width: auto;">
    </div>
    
    <div class="row" style="margin-top: 14px;">
      <span style="font-size: 14px; color: var(--subtext);">當月總預算上限</span>
      <div style="display: flex; gap: 6px; width: 55%;">
        <input type="number" id="totalBudgetInput" placeholder="設定總額" style="padding: 6px 10px;">
        <button onclick="saveTotalBudget()" style="border:none; background: var(--primary); color:#fff; border-radius: 8px; padding: 0 12px; font-size: 13px;">設定</button>
      </div>
    </div>

    <div class="row" style="margin-top: 14px; font-size: 14px;">
      <span>已花費 / 總上限</span>
      <span id="totalSummary" style="font-weight: 600;">NT$ 0 / NT$ 0</span>
    </div>
    <div class="progress-bar-bg">
      <div id="totalProgressBar" class="progress-bar-fill"></div>
    </div>
    <div class="row" style="margin-top: 8px; font-size: 14px;">
      <span>本月剩餘額度：</span>
      <span id="totalRemaining" class="amount-positive">NT$ 0</span>
    </div>
  </div>

  <!-- 圓餅圖比例分析 -->
  <div class="card">
    <h3 style="margin:0 0 8px 0;">📊 開銷佔比分析</h3>
    <div class="chart-container">
      <canvas id="pieChartCanvas" width="260" height="260"></canvas>
      <div class="chart-legend" id="chartLegendList"></div>
    </div>
  </div>

  <!-- 記一筆開支 -->
  <div class="card">
    <h3 style="margin:0 0 12px 0;">記一筆開支</h3>

    <div class="pill-group">
      <div class="pill-btn active" id="date-today" onclick="setDateOption('today')">今天</div>
      <div class="pill-btn" id="date-yesterday" onclick="setDateOption('yesterday')">昨天</div>
      <div class="pill-btn" id="date-custom" onclick="setDateOption('custom')">自選日期</div>
    </div>
    <div id="customDateContainer" style="display: none; margin-bottom: 12px;">
      <input type="date" id="customDateInput" onchange="applyCustomDate()">
    </div>

    <div style="font-size: 13px; color: var(--subtext);">點擊選擇消費類別（跨月通用）：</div>
    <div class="chip-grid" id="categoryChips"></div>

    <div style="display: flex; gap: 8px; margin-bottom: 10px;">
      <input type="number" id="expenseAmount" placeholder="金額 (NT$)" inputmode="numeric" style="flex: 1.2;">
      <input type="text" id="expenseDesc" placeholder="備註 (例如: 晚餐)" style="flex: 1.8;">
    </div>
    <button class="btn-main" onclick="addExpense()">確認記入</button>
  </div>

  <!-- 各細項額度與管理 -->
  <div class="card">
    <h3 style="margin:0 0 12px 0;">各類別剩餘額度</h3>
    <div id="categoryProgressList"></div>

    <div style="margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border);">
      <div style="font-size: 13px; color: var(--subtext); margin-bottom: 6px;">＋ 新增類別與每月上限（跨月份永久保留）</div>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="newCatName" placeholder="名稱 (如: 娛樂)">
        <input type="number" id="newCatLimit" placeholder="上限 (NT$)">
        <button onclick="addNewCategory()" style="border:none; background:#0f172a; color:#fff; border-radius: 8px; padding: 0 14px; font-size: 13px;">新增</button>
      </div>
    </div>
  </div>

  <!-- 明細與匯出區 -->
  <div class="card">
    <h3 style="margin:0 0 12px 0;">本月開銷明細與匯出</h3>
    
    <div style="display: flex; gap: 10px; margin-bottom: 16px;">
      <button class="export-btn" onclick="openReportModal()" style="flex: 1.1; background: #e11d48;">
        <span>📄 檢視 / 輸出 PDF 報表</span>
      </button>
      <button class="export-btn" onclick="exportStyledExcel()" style="flex: 0.9; background: #059669;">
        <span>📊 匯出美化 Excel</span>
      </button>
    </div>

    <div id="recentExpenseList"></div>
  </div>

  <!-- 報表預覽彈跳視窗 -->
  <div id="reportModal">
    <div class="modal-content">
      <div id="reportPreviewArea"></div>
      
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button onclick="shareOrSaveReport()" style="flex: 1; background: #2563eb; color: #fff; border:none; border-radius:10px; padding:12px; font-weight:bold; font-size:14px;">📤 儲存 PDF / 分享</button>
        <button onclick="closeReportModal()" style="flex: 1; background: #e2e8f0; color: #334155; border:none; border-radius:10px; padding:12px; font-weight:bold; font-size:14px;">關閉視窗</button>
      </div>
    </div>
  </div>

  <script>
    const PALETTE = ['#2563eb', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4', '#f97316', '#64748b'];

    const todayObj = new Date();
    let selectedMonth = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}`;
    let selectedDate = formatDate(todayObj);
    let selectedCategoryIdx = null;

    document.getElementById('currentMonth').value = selectedMonth;

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getMonthKey(name) { return `${selectedMonth}_${name}`; }

    // 全域通用類別管理
    function getGlobalCategories() {
      let cats = JSON.parse(localStorage.getItem('global_categories') || 'null');
      if (!cats) {
        cats = JSON.parse(localStorage.getItem(getMonthKey('categories')) || '[]');
        if (cats.length > 0) {
          localStorage.setItem('global_categories', JSON.stringify(cats));
        }
      }
      return cats || [];
    }

    function saveGlobalCategories(cats) {
      localStorage.setItem('global_categories', JSON.stringify(cats));
    }

    function setDateOption(type) {
      document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
      const customContainer = document.getElementById('customDateContainer');

      if (type === 'today') {
        document.getElementById('date-today').classList.add('active');
        customContainer.style.display = 'none';
        selectedDate = formatDate(new Date());
      } else if (type === 'yesterday') {
        document.getElementById('date-yesterday').classList.add('active');
        customContainer.style.display = 'none';
        const d = new Date();
        d.setDate(d.getDate() - 1);
        selectedDate = formatDate(d);
      } else {
        document.getElementById('date-custom').classList.add('active');
        customContainer.style.display = 'block';
        const customInput = document.getElementById('customDateInput');
        if (!customInput.value) customInput.value = formatDate(new Date());
        selectedDate = customInput.value;
      }
    }

    function applyCustomDate() {
      selectedDate = document.getElementById('customDateInput').value;
    }

    // 圓餅圖
    function drawPieChart(catStats, totalSpent) {
      const canvas = document.getElementById('pieChartCanvas');
      const ctx = canvas.getContext('2d');
      const legend = document.getElementById('chartLegendList');
      legend.innerHTML = '';
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (totalSpent === 0 || catStats.length === 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, 95, 0, 2 * Math.PI);
        ctx.fillStyle = '#f1f5f9';
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('本月尚無開銷資料', cx, cy);
        return;
      }

      let startAngle = -0.5 * Math.PI;
      catStats.forEach((cat, index) => {
        const sliceAngle = (cat.spent / totalSpent) * 2 * Math.PI;
        const color = PALETTE[index % PALETTE.length];

        ctx.beginPath();
        ctx.arc(cx, cy, 105, startAngle, startAngle + sliceAngle);
        ctx.lineTo(cx, cy);
        ctx.fillStyle = color;
        ctx.fill();

        startAngle += sliceAngle;

        const pct = ((cat.spent / totalSpent) * 100).toFixed(1);
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `
          <div style="display:flex; align-items:center;">
            <span class="legend-color-dot" style="background:${color};"></span>
            <span>${cat.name}</span>
          </div>
          <div style="font-weight:600;">
            NT$ ${cat.spent.toLocaleString()} 
            <span style="color:var(--subtext); font-weight:normal; margin-left:4px;">(${pct}%)</span>
          </div>
        `;
        legend.appendChild(item);
      });

      ctx.beginPath();
      ctx.arc(cx, cy, 60, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`NT$ ${totalSpent.toLocaleString()}`, cx, cy - 8);

      ctx.fillStyle = '#64748b';
      ctx.font = '12px sans-serif';
      ctx.fillText('總花費', cx, cy + 12);
    }

    // 儀表板載入
    function loadDashboard() {
      const budget = localStorage.getItem(getMonthKey('budget')) || 0;
      const categories = getGlobalCategories();
      const expenses = JSON.parse(localStorage.getItem(getMonthKey('expenses')) || '[]');

      document.getElementById('totalBudgetInput').value = budget > 0 ? budget : '';

      const catSpent = {};
      let totalSpent = 0;
      expenses.forEach(e => {
        catSpent[e.catIdx] = (catSpent[e.catIdx] || 0) + Number(e.amount);
        totalSpent += Number(e.amount);
      });

      const remaining = Number(budget) - totalSpent;
      document.getElementById('totalSummary').innerText = `NT$ ${totalSpent.toLocaleString()} / NT$ ${Number(budget).toLocaleString()}`;
      const remEl = document.getElementById('totalRemaining');
      remEl.innerText = `NT$ ${remaining.toLocaleString()}`;
      remEl.className = remaining >= 0 ? 'amount-positive' : 'amount-negative';

      const ratio = budget > 0 ? Math.min((totalSpent / budget) * 100, 100) : 0;
      const totalBar = document.getElementById('totalProgressBar');
      totalBar.style.width = `${ratio}%`;
      totalBar.style.background = totalSpent > budget ? 'var(--danger)' : 'var(--primary)';

      const catStats = [];
      categories.forEach((cat, idx) => {
        if (catSpent[idx] && catSpent[idx] > 0) {
          catStats.push({ name: cat.name, spent: catSpent[idx] });
        }
      });
      catStats.sort((a, b) => b.spent - a.spent);
      drawPieChart(catStats, totalSpent);

      // 分類按鈕
      const chips = document.getElementById('categoryChips');
      chips.innerHTML = '';
      if (categories.length === 0) {
        chips.innerHTML = '<span style="font-size:13px; color:var(--subtext);">尚未新增任何類別，請在下方新增</span>';
        selectedCategoryIdx = null;
      } else {
        categories.forEach((cat, idx) => {
          const btn = document.createElement('div');
          btn.className = `chip-btn ${selectedCategoryIdx === idx ? 'active' : ''}`;
          btn.innerText = cat.name;
          btn.onclick = () => {
            selectedCategoryIdx = idx;
            loadDashboard();
          };
          chips.appendChild(btn);
        });
      }

      // 各細項進度與編輯/刪除
      const progList = document.getElementById('categoryProgressList');
      progList.innerHTML = '';
      if (categories.length === 0) {
        progList.innerHTML = '<div style="color:var(--subtext); font-size:13px;">目前尚無任何自訂類別</div>';
      }
      categories.forEach((cat, idx) => {
        const spent = catSpent[idx] || 0;
        const left = Number(cat.limit) - spent;
        const catRatio = cat.limit > 0 ? Math.min((spent / cat.limit) * 100, 100) : 0;
        const color = spent > cat.limit ? 'var(--danger)' : (catRatio > 80 ? 'var(--warning)' : 'var(--primary)');

        const item = document.createElement('div');
        item.style.marginBottom = '14px';
        item.innerHTML = `
          <div class="row" style="font-size: 14px;">
            <div style="display:flex; align-items:center; gap: 6px;">
              <strong>${cat.name}</strong>
              <button class="edit-btn" onclick="editCategory(${idx})">✏️ 編輯</button>
              <button class="del-btn" onclick="deleteCategory(${idx})">🗑️ 刪除</button>
            </div>
            <span>剩餘: <span class="${left >= 0 ? 'amount-positive' : 'amount-negative'}">NT$ ${left.toLocaleString()}</span></span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${catRatio}%; background: ${color};"></div>
          </div>
          <div class="row" style="font-size: 11px; color: var(--subtext); margin-top: 4px;">
            <span>已付: NT$ ${spent.toLocaleString()}</span>
            <span>每月上限: NT$ ${Number(cat.limit).toLocaleString()}</span>
          </div>
        `;
        progList.appendChild(item);
      });

      // 明細清單
      const listEl = document.getElementById('recentExpenseList');
      listEl.innerHTML = '';
      if (expenses.length === 0) {
        listEl.innerHTML = '<div style="color:var(--subtext); font-size:13px; text-align:center; padding: 12px 0;">當月尚無開銷紀錄</div>';
      } else {
        expenses.slice().reverse().forEach((e, revIdx) => {
          const actualIdx = expenses.length - 1 - revIdx;
          const catName = categories[e.catIdx] ? categories[e.catIdx].name : '已刪除類別';
          const row = document.createElement('div');
          row.className = 'expense-list-item';
          row.innerHTML = `
            <div>
              <div style="font-weight:600; font-size:14px;">${catName} - NT$ ${Number(e.amount).toLocaleString()}</div>
              <div style="font-size:12px; color:var(--subtext);">${e.date} ｜ ${e.desc}</div>
            </div>
            <button class="del-btn" onclick="deleteExpense(${actualIdx})">刪除</button>
          `;
          listEl.appendChild(row);
        });
      }
    }

    function switchMonth() {
      selectedMonth = document.getElementById('currentMonth').value;
      selectedCategoryIdx = null;
      loadDashboard();
    }

    function saveTotalBudget() {
      const budget = document.getElementById('totalBudgetInput').value;
      if (!budget || budget <= 0) return alert('請輸入有效預算');
      localStorage.setItem(getMonthKey('budget'), budget);
      loadDashboard();
    }

    function addNewCategory() {
      const name = document.getElementById('newCatName').value.trim();
      const limit = document.getElementById('newCatLimit').value;
      if (!name || !limit) return alert('請填寫類別名稱與上限');

      const cats = getGlobalCategories();
      cats.push({ name, limit });
      saveGlobalCategories(cats);

      document.getElementById('newCatName').value = '';
      document.getElementById('newCatLimit').value = '';
      if (selectedCategoryIdx === null) selectedCategoryIdx = cats.length - 1;
      loadDashboard();
    }

    function editCategory(idx) {
      const cats = getGlobalCategories();
      const cat = cats[idx];
      if (!cat) return;

      const newName = prompt('請輸入新的分類名稱：', cat.name);
      if (newName === null) return;
      const trimmedName = newName.trim();
      if (!trimmedName) return alert('名稱不能為空');

      const newLimit = prompt(`請輸入「${trimmedName}」的每月預算上限 (NT$)：`, cat.limit);
      if (newLimit === null) return;
      const numLimit = Number(newLimit);
      if (isNaN(numLimit) || numLimit <= 0) return alert('請輸入有效金額');

      cats[idx].name = trimmedName;
      cats[idx].limit = numLimit;
      saveGlobalCategories(cats);
      loadDashboard();
    }

    function deleteCategory(idx) {
      const cats = getGlobalCategories();
      const cat = cats[idx];
      if (!cat) return;

      if (!confirm(`確定要刪除「${cat.name}」分類嗎？\n（過去月份記錄的花費依然會保留金額）`)) return;

      cats.splice(idx, 1);
      saveGlobalCategories(cats);
      if (selectedCategoryIdx === idx) {
        selectedCategoryIdx = null;
      } else if (selectedCategoryIdx > idx) {
        selectedCategoryIdx--;
      }
      loadDashboard();
    }

    function addExpense() {
      if (selectedCategoryIdx === null) return alert('請先點選消費類別按鈕');
      const amount = document.getElementById('expenseAmount').value;
      const desc = document.getElementById('expenseDesc').value.trim();
      if (!amount || Number(amount) <= 0) return alert('請輸入有效金額');

      const expenses = JSON.parse(localStorage.getItem(getMonthKey('expenses')) || '[]');
      expenses.push({
        catIdx: selectedCategoryIdx,
        amount: Number(amount),
        desc: desc || '日常開銷',
        date: selectedDate
      });
      localStorage.setItem(getMonthKey('expenses'), JSON.stringify(expenses));

      document.getElementById('expenseAmount').value = '';
      document.getElementById('expenseDesc').value = '';
      loadDashboard();
    }

    function deleteExpense(idx) {
      if (!confirm('確定刪除這筆開支嗎？')) return;
      const expenses = JSON.parse(localStorage.getItem(getMonthKey('expenses')) || '[]');
      expenses.splice(idx, 1);
      localStorage.setItem(getMonthKey('expenses'), JSON.stringify(expenses));
      loadDashboard();
    }

    // ==========================================
    // 1. 檢視與輸出精美 PDF 報表 (100% 繁體中文無亂碼)
    // ==========================================
    function openReportModal() {
      const categories = getGlobalCategories();
      const expenses = JSON.parse(localStorage.getItem(getMonthKey('expenses')) || '[]');
      const budget = Number(localStorage.getItem(getMonthKey('budget')) || 0);

      if (expenses.length === 0) return alert('本月尚無任何紀錄可供生成報表');

      let totalSpent = 0;
      const catSpent = {};
      expenses.forEach(e => {
        totalSpent += Number(e.amount);
        catSpent[e.catIdx] = (catSpent[e.catIdx] || 0) + Number(e.amount);
      });
      const remaining = budget - totalSpent;
      const chartImg = document.getElementById('pieChartCanvas').toDataURL('image/png');

      let catRowsHtml = '';
      categories.forEach((cat, idx) => {
        const spent = catSpent[idx] || 0;
        const left = Number(cat.limit) - spent;
        const pct = totalSpent > 0 ? ((spent / totalSpent) * 100).toFixed(1) : 0;
        const isOver = left < 0;
        catRowsHtml += `
          <tr style="border-bottom: 1px solid #e2e8f0; font-size: 12px;">
            <td style="padding: 6px 8px;">${cat.name}</td>
            <td style="padding: 6px 8px; text-align:right;">NT$ ${Number(cat.limit).toLocaleString()}</td>
            <td style="padding: 6px 8px; text-align:right;">NT$ ${spent.toLocaleString()}</td>
            <td style="padding: 6px 8px; text-align:right; font-weight: bold; color: ${isOver ? '#ef4444' : '#10b981'};">NT$ ${left.toLocaleString()}</td>
            <td style="padding: 6px 8px; text-align:right;">${pct}%</td>
          </tr>
        `;
      });

      let expRowsHtml = '';
      expenses.forEach(e => {
        const catName = categories[e.catIdx] ? categories[e.catIdx].name : '已刪除類別';
        expRowsHtml += `
          <tr style="border-bottom: 1px solid #f1f5f9; font-size: 12px;">
            <td style="padding: 6px 8px;">${e.date}</td>
            <td style="padding: 6px 8px; font-weight:600;">${catName}</td>
            <td style="padding: 6px 8px; color:#475569;">${e.desc}</td>
            <td style="padding: 6px 8px; text-align:right; font-weight:bold;">NT$ ${Number(e.amount).toLocaleString()}</td>
          </tr>
        `;
      });

      document.getElementById('reportPreviewArea').innerHTML = `
        <div style="border-bottom: 2px solid #0f172a; padding-bottom: 8px; margin-bottom: 12px;">
          <h2 style="margin:0; font-size: 18px; color: #0f172a;">【${selectedMonth}】個人財務月度分析報表</h2>
          <div style="font-size: 11px; color: #64748b; margin-top: 3px;">生成時間：${new Date().toLocaleString('zh-TW')}</div>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <div style="flex:1; background: #f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:8px; text-align:center;">
            <div style="font-size:10px; color:#64748b;">總預算</div>
            <div style="font-size:15px; font-weight:bold; color:#0f172a; margin-top:2px;">NT$ ${budget.toLocaleString()}</div>
          </div>
          <div style="flex:1; background: #eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:8px; text-align:center;">
            <div style="font-size:10px; color:#1d4ed8;">總支出</div>
            <div style="font-size:15px; font-weight:bold; color:#2563eb; margin-top:2px;">NT$ ${totalSpent.toLocaleString()}</div>
          </div>
          <div style="flex:1; background: ${remaining < 0 ? '#fee2e2' : '#ecfdf5'}; border:1px solid ${remaining < 0 ? '#fca5a5' : '#a7f3d0'}; border-radius:8px; padding:8px; text-align:center;">
            <div style="font-size:10px; color: ${remaining < 0 ? '#b91c1c' : '#047857'};">淨額</div>
            <div style="font-size:15px; font-weight:bold; color:${remaining < 0 ? '#ef4444' : '#10b981'}; margin-top:2px;">NT$ ${remaining.toLocaleString()}</div>
          </div>
        </div>

        <h4 style="margin: 0 0 6px 0; font-size: 13px;">開銷佔比分析</h4>
        <div style="text-align: center; margin-bottom: 12px;">
          <img src="${chartImg}" style="width: 170px; height: 170px;" />
        </div>

        <table style="width: 100%; border-collapse: collapse; margin-bottom: 16px;">
          <thead>
            <tr style="background: #1e293b; color: #ffffff; font-size: 11px; text-align:left;">
              <th style="padding: 6px 8px;">分類</th>
              <th style="padding: 6px 8px; text-align:right;">上限</th>
              <th style="padding: 6px 8px; text-align:right;">實付</th>
              <th style="padding: 6px 8px; text-align:right;">剩餘</th>
              <th style="padding: 6px 8px; text-align:right;">佔比</th>
            </tr>
          </thead>
          <tbody>${catRowsHtml}</tbody>
        </table>

        <h4 style="margin: 0 0 6px 0; font-size: 13px;">開銷流水帳</h4>
        <table style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="background: #334155; color: #ffffff; font-size: 11px; text-align:left;">
              <th style="padding: 6px 8px; width: 22%;">日期</th>
              <th style="padding: 6px 8px; width: 22%;">分類</th>
              <th style="padding: 6px 8px;">備註</th>
              <th style="padding: 6px 8px; width: 24%; text-align:right;">金額</th>
            </tr>
          </thead>
          <tbody>${expRowsHtml}</tbody>
        </table>
      `;

      document.getElementById('reportModal').style.display = 'block';
    }

    function closeReportModal() {
      document.getElementById('reportModal').style.display = 'none';
    }

    function shareOrSaveReport() {
      const content = document.getElementById('reportPreviewArea').innerText;
      if (navigator.share) {
        navigator.share({
          title: `【${selectedMonth}】個人財務月度分析報表`,
          text: content
        }).catch(() => {});
      } else {
        window.print(); // 若為一般瀏覽器環境則呼叫列印/另存 PDF
      }
    }

    // ==========================================
    // 2. 輸出美化 Excel (維持高質感版面與超支亮紅)
    // ==========================================
    async function exportStyledExcel() {
      const categories = getGlobalCategories();
      const expenses = JSON.parse(localStorage.getItem(getMonthKey('expenses')) || '[]');
      const budget = Number(localStorage.getItem(getMonthKey('budget')) || 0);

      if (expenses.length === 0) return alert('本月尚無任何紀錄可匯出');

      let totalSpent = 0;
      const catSpent = {};
      expenses.forEach(e => {
        totalSpent += Number(e.amount);
        catSpent[e.catIdx] = (catSpent[e.catIdx] || 0) + Number(e.amount);
      });
      const remaining = budget - totalSpent;

      const workbook = new ExcelJS.Workbook();
      workbook.creator = '智慧預算記帳';

      const wsSummary = workbook.addWorksheet('月度總覽與分析', { views: [{ showGridLines: true }] });

      wsSummary.mergeCells('A1:E1');
      const titleCell = wsSummary.getCell('A1');
      titleCell.value = `【${selectedMonth}】個人財務開銷月度總結`;
      titleCell.font = { name: 'PingFang TC', size: 16, bold: true, color: { argb: 'FFFFFFFF' } };
      titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
      titleCell.alignment = { vertical: 'middle', horizontal: 'center' };
      wsSummary.getRow(1).height = 36;

      wsSummary.getCell('A3').value = '總預算上限';
      wsSummary.getCell('A4').value = budget;
      wsSummary.getCell('B3').value = '本月總支出';
      wsSummary.getCell('B4').value = totalSpent;
      wsSummary.getCell('C3').value = '剩餘可用額度';
      wsSummary.getCell('C4').value = remaining;

      ['A3', 'B3', 'C3'].forEach(cell => {
        wsSummary.getCell(cell).font = { name: 'PingFang TC', size: 10, color: { argb: 'FF64748B' } };
        wsSummary.getCell(cell).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF1F5F9' } };
      });

      ['A4', 'B4', 'C4'].forEach(cell => {
        wsSummary.getCell(cell).font = { name: 'PingFang TC', size: 14, bold: true };
        wsSummary.getCell(cell).numFmt = '"NT$" #,##0';
      });

      if (remaining < 0) {
        wsSummary.getCell('C4').font = { name: 'PingFang TC', size: 14, bold: true, color: { argb: 'FFEF4444' } };
        wsSummary.getCell('C4').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEE2E2' } };
      } else {
        wsSummary.getCell('C4').font = { name: 'PingFang TC', size: 14, bold: true, color: { argb: 'FF059669' } };
      }

      wsSummary.getCell('A6').value = '分類名稱';
      wsSummary.getCell('B6').value = '預算上限';
      wsSummary.getCell('C6').value = '實際花費';
      wsSummary.getCell('D6').value = '剩餘額度';
      wsSummary.getCell('E6').value = '佔比 (%)';

      ['A6', 'B6', 'C6', 'D6', 'E6'].forEach(cell => {
        const c = wsSummary.getCell(cell);
        c.font = { name: 'PingFang TC', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } };
        c.alignment = { vertical: 'middle', horizontal: cell === 'A6' ? 'left' : 'right' };
      });
      wsSummary.getRow(6).height = 24;

      let rowIdx = 7;
      categories.forEach((cat, idx) => {
        const spent = catSpent[idx] || 0;
        const left = Number(cat.limit) - spent;
        const pct = totalSpent > 0 ? (spent / totalSpent) : 0;
        const isOver = left < 0;

        wsSummary.getCell(`A${rowIdx}`).value = cat.name;
        wsSummary.getCell(`B${rowIdx}`).value = Number(cat.limit);
        wsSummary.getCell(`C${rowIdx}`).value = spent;
        wsSummary.getCell(`D${rowIdx}`).value = left;
        wsSummary.getCell(`E${rowIdx}`).value = pct;

        ['B', 'C', 'D'].forEach(col => {
          wsSummary.getCell(`${col}${rowIdx}`).numFmt = '#,##0';
        });
        wsSummary.getCell(`E${rowIdx}`).numFmt = '0.0%';

        if (isOver) {
          wsSummary.getCell(`D${rowIdx}`).font = { name: 'PingFang TC', color: { argb: 'FFB91C1C' }, bold: true };
          wsSummary.getCell(`D${rowIdx}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEE2E2' } };
        } else {
          wsSummary.getCell(`D${rowIdx}`).font = { name: 'PingFang TC', color: { argb: 'FF047857' } };
        }

        if (rowIdx % 2 === 0) {
          ['A', 'B', 'C', 'E'].forEach(col => {
            wsSummary.getCell(`${col}${rowIdx}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
          });
        }
        rowIdx++;
      });

      const chartBase64 = document.getElementById('pieChartCanvas').toDataURL('image/png');
      const imageId = workbook.addImage({ base64: chartBase64, extension: 'png' });
      wsSummary.addImage(imageId, { tl: { col: 5.5, row: 2 }, ext: { width: 280, height: 280 } });

      wsSummary.columns = [{ width: 16 }, { width: 15 }, { width: 15 }, { width: 16 }, { width: 14 }];

      const wsDetail = workbook.addWorksheet('詳細消費清單', { views: [{ showGridLines: true }] });
      wsDetail.mergeCells('A1:D1');
      const detailTitle = wsDetail.getCell('A1');
      detailTitle.value = `【${selectedMonth}】詳細消費開支明細記錄`;
      detailTitle.font = { name: 'PingFang TC', size: 14, bold: true, color: { argb: 'FFFFFFFF' } };
      detailTitle.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F172A' } };
      detailTitle.alignment = { vertical: 'middle', horizontal: 'center' };
      wsDetail.getRow(1).height = 30;

      wsDetail.getRow(3).values = ['日期', '消費類別', '備註說明', '金額 (NT$)'];
      wsDetail.getRow(3).font = { name: 'PingFang TC', bold: true, color: { argb: 'FFFFFFFF' } };
      wsDetail.getRow(3).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF334155' } };
      wsDetail.getRow(3).height = 22;

      let detailRow = 4;
      expenses.forEach(e => {
        const catName = categories[e.catIdx] ? categories[e.catIdx].name : '已刪除類別';
        const row = wsDetail.getRow(detailRow);
        row.values = [e.date, catName, e.desc, Number(e.amount)];
        row.getCell(4).numFmt = '#,##0';
        row.font = { name: 'PingFang TC', size: 10 };

        if (detailRow % 2 === 0) {
          row.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } };
        }
        detailRow++;
      });

      wsDetail.columns = [{ width: 14 }, { width: 16 }, { width: 30 }, { width: 16 }];

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${selectedMonth}_財務報表.xlsx`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    loadDashboard();
  </script>
</body>
</html>
